<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چاوی کوردی - پری ئۆردێر</title>

    <!-- فۆنتی فەرمی و مۆدێرنی Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* ڕێکخستنی بنچینەیی و چاککردنی فۆنت */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', -apple-system, sans-serif !important;
            letter-spacing: 0 !important; /* ڕێگری لە لێکجیابوونەوەی پیتە کوردییەکان */
            word-spacing: normal !important;
        }

        body {
            background-color: #030712;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #f8fafc;
        }

        /* باکگراوندی جوڵاوی Mesh Gradient */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
            filter: blur(40px);
            animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(5deg); }
        }

        /* تۆڕی هێڵکاری شاراوەی باکگراوند (Cyber Grid) */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            pointer-events: none;
        }

        /* کارتی سەرەکی - Neo-Minimalist */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 32px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* ئایکۆنی سەر کارتەکە */
        .app-icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px auto;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15);
        }

        .app-icon {
            width: 36px;
            height: 36px;
            fill: #38bdf8;
        }

        /* ناونیشانی پری ئۆردێر */
        .main-heading {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px !important;
        }

        /* دەقی دووەم */
        .sub-heading {
            font-size: 15px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 36px;
        }

        .sub-heading span {
            color: #38bdf8;
            font-weight: 700;
        }

        /* دووگمەی ناوازەی تەلەگرام */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: #f8fafc;
            color: #0f172a;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .telegram-btn:hover {
            background: #38bdf8;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.3);
        }

        .telegram-btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: fill 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- بەشەکانی باکگراوند -->
    <div class="bg-mesh"></div>
    <div class="grid-overlay"></div>

    <!-- ناوۆکی دیزاینەکە -->
    <div class="container">
        
        <!-- ئایکۆنی سەرەوە -->
        <div class="app-icon-wrapper">
            <svg class="app-icon" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>

        <!-- ناونیشانی سەرەکی -->
        <h1 class="main-heading">پری ئۆردێر</h1>

        <!-- دەقی ژێرەوە -->
        <p class="sub-heading">
            ئەگەر دەتەوێ پری ئۆردەری <span>چاوی کوردی</span> بکە پێش ئەوەی دامەزرێت
        </p>

        <!-- دووگمەی داواکاری -->
        <a id="telegramLink" href="#" target="_blank" class="telegram-btn">
            <svg class="btn-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.07-.78 4.18-1.82 6.98-3.02 8.39-3.61 4-.1.68 4.16 2.87 4.16 3.82z"/>
            </svg>
            <span>پری ئۆردەر بکە لە تەلەگرام</span>
        </a>

    </div>

    <script>
        // ==========================================
        // ناوی بەکارهێنەری تەلەگرامەکەت لێرە بنووسە
        // ==========================================
        const telegramUsername = "Shblood1192"; // بۆ نموونە: KurdishEye

        // پەیامی ئۆتۆماتیکی
        const autoText = "سڵاو، من ئەپی چاوی کوردیم دەوێت پێش کڕینی ئایە نرخی چەندە؟";

        // دروستکردنی لینکەکە
        const finalTelegramUrl = `https://t.me/${telegramUsername}?text=${encodeURIComponent(autoText)}`;

        // بەستنەوەی لینک بە دووگمەکە
        document.getElementById('telegramLink').href = finalTelegramUrl;
    </script>

</body>
</html>
